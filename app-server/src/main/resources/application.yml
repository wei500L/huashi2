server:
  port: ${APP_SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: app-server
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  servlet:
    multipart:
      max-file-size: ${APP_MULTIPART_MAX_FILE_SIZE:50MB}
      max-request-size: ${APP_MULTIPART_MAX_REQUEST_SIZE:50MB}
  datasource:
    url: jdbc:mysql://${APP_DB_HOST:localhost}:${APP_DB_PORT:3306}/${APP_DB_NAME:ef_transfer_app}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
    username: ${APP_DB_USERNAME:ef_user}
    password: ${APP_DB_PASSWORD:ef_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${APP_DB_POOL_MAX_SIZE:16}
      minimum-idle: ${APP_DB_POOL_MIN_IDLE:4}
      connection-timeout: ${APP_DB_POOL_CONNECTION_TIMEOUT:3000}
      idle-timeout: ${APP_DB_POOL_IDLE_TIMEOUT:600000}
      max-lifetime: ${APP_DB_POOL_MAX_LIFETIME:1800000}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      password: ${REDIS_PASSWORD:}
      timeout: 3s
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:ef_admin}
    password: ${RABBITMQ_PASSWORD:ef_password}
    virtual-host: ${RABBITMQ_VHOST:/}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
    export:
      otlp:
        enabled: ${OTEL_EXPORTER_ENABLED:false}
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    env:
      enabled: false
  metrics:
    tags:
      application: ${spring.application.name}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: true
      logic-not-delete-value: false

app:
  sessions:
    lifecycle:
      enabled: ${APP_SESSIONS_LIFECYCLE_ENABLED:true}
      poll-interval: ${APP_SESSIONS_LIFECYCLE_POLL_INTERVAL:PT15M}
      abandon-timeout: ${APP_SESSIONS_LIFECYCLE_ABANDON_TIMEOUT:PT12H}
      batch-size: ${APP_SESSIONS_LIFECYCLE_BATCH_SIZE:64}
  redis:
    redisson-enabled: ${APP_REDIS_REDISSON_ENABLED:true}
  demo-data:
    enabled: ${APP_DEMO_DATA_ENABLED:false}
  events:
    rabbit-publish-enabled: ${APP_EVENTS_RABBIT_PUBLISH_ENABLED:true}
    outbox:
      enabled: ${APP_EVENTS_OUTBOX_ENABLED:true}
      poll-interval: ${APP_EVENTS_OUTBOX_POLL_INTERVAL:PT5S}
      batch-size: ${APP_EVENTS_OUTBOX_BATCH_SIZE:20}
      max-attempts: ${APP_EVENTS_OUTBOX_MAX_ATTEMPTS:8}
      initial-backoff: ${APP_EVENTS_OUTBOX_INITIAL_BACKOFF:PT5S}
      max-backoff: ${APP_EVENTS_OUTBOX_MAX_BACKOFF:PT5M}
      stuck-threshold: ${APP_EVENTS_OUTBOX_STUCK_THRESHOLD:PT1M}
      confirm-timeout: ${APP_EVENTS_OUTBOX_CONFIRM_TIMEOUT:PT5S}
  analytics:
    compensation:
      enabled: ${APP_ANALYTICS_COMPENSATION_ENABLED:true}
  assessment:
    public-delivery:
      hmac-secret: ${APP_ASSESSMENT_CODE_HMAC_SECRET:local-only-change-this-participant-code-secret}
      session-ttl: ${APP_ASSESSMENT_PUBLIC_SESSION_TTL:PT12H}
    sensitive-profile-key: ${APP_ASSESSMENT_SENSITIVE_PROFILE_KEY:local-only-change-this-profile-key}
    sensitive-profile-key-version: ${APP_ASSESSMENT_SENSITIVE_PROFILE_KEY_VERSION:v1}
    ai-analysis:
      enabled: ${APP_ASSESSMENT_AI_ANALYSIS_ENABLED:true}
      poll-interval: ${APP_ASSESSMENT_AI_ANALYSIS_POLL_INTERVAL:PT5S}
      batch-size: ${APP_ASSESSMENT_AI_ANALYSIS_BATCH_SIZE:10}
      max-retries: ${APP_ASSESSMENT_AI_ANALYSIS_MAX_RETRIES:2}
      retry-delay: ${APP_ASSESSMENT_AI_ANALYSIS_RETRY_DELAY:PT5S}
      processing-timeout: ${APP_ASSESSMENT_AI_ANALYSIS_PROCESSING_TIMEOUT:PT5M}
    seed:
      lexibridge-enabled: ${APP_ASSESSMENT_LEXIBRIDGE_SEED_ENABLED:true}
      # Seeds only the FF4 V2 practice question bank (no research questionnaire);
      # the V3 package is consumed by the student self-practice module.
      lexibridge-v3-enabled: ${APP_ASSESSMENT_LEXIBRIDGE_V3_SEED_ENABLED:false}
    timeout:
      enabled: ${APP_ASSESSMENT_TIMEOUT_ENABLED:true}
      poll-interval: ${APP_ASSESSMENT_TIMEOUT_POLL_INTERVAL:PT30S}
      batch-size: ${APP_ASSESSMENT_TIMEOUT_BATCH_SIZE:200}
      submission-grace-period: ${APP_ASSESSMENT_SUBMISSION_GRACE_PERIOD:PT3S}
  notification:
    health-monitor:
      enabled: ${APP_NOTIFICATION_HEALTH_MONITOR_ENABLED:true}
      poll-interval: ${APP_NOTIFICATION_HEALTH_MONITOR_POLL_INTERVAL:PT5M}
  ops:
    config:
      encryption-secret: ${APP_OPS_CONFIG_ENCRYPTION_SECRET:}
  security:
    cors:
      allowed-origins:
        - ${APP_CORS_ALLOWED_ORIGIN_LOCALHOST:http://localhost:3000}
        - ${APP_CORS_ALLOWED_ORIGIN_LOOPBACK:http://127.0.0.1:3000}
      allowed-methods: ${APP_CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,OPTIONS}
      allowed-headers: ${APP_CORS_ALLOWED_HEADERS:Authorization,Content-Type,Accept}
      exposed-headers: ${APP_CORS_EXPOSED_HEADERS:X-Trace-Id}
      allow-credentials: ${APP_CORS_ALLOW_CREDENTIALS:false}
      max-age: ${APP_CORS_MAX_AGE:PT1H}
    jwt:
      legacy-secret: ${APP_JWT_LEGACY_SECRET:${APP_JWT_SECRET:}}
      active-kid: ${APP_JWT_ACTIVE_KID:current}
      keys:
        - kid: ${APP_JWT_KEYS_0_KID:${APP_JWT_ACTIVE_KID:current}}
          secret: ${APP_JWT_KEYS_0_SECRET:${APP_JWT_SECRET:}}
        - kid: ${APP_JWT_KEYS_1_KID:}
          secret: ${APP_JWT_KEYS_1_SECRET:}
      issuer: ${APP_JWT_ISSUER:ef-transfer-platform}
      access-token-ttl: ${APP_JWT_ACCESS_TTL:PT30M}
      refresh-token-ttl: ${APP_JWT_REFRESH_TTL:PT168H}
    rate-limit:
      auth:
        enabled: ${APP_AUTH_RATE_LIMIT_ENABLED:true}
        login:
          ip:
            limit: ${APP_AUTH_RATE_LIMIT_LOGIN_IP_LIMIT:20}
            window: ${APP_AUTH_RATE_LIMIT_LOGIN_IP_WINDOW:PT1M}
          principal:
            limit: ${APP_AUTH_RATE_LIMIT_LOGIN_PRINCIPAL_LIMIT:10}
            window: ${APP_AUTH_RATE_LIMIT_LOGIN_PRINCIPAL_WINDOW:PT10M}
        refresh:
          ip:
            limit: ${APP_AUTH_RATE_LIMIT_REFRESH_IP_LIMIT:40}
            window: ${APP_AUTH_RATE_LIMIT_REFRESH_IP_WINDOW:PT1M}
          session:
            limit: ${APP_AUTH_RATE_LIMIT_REFRESH_SESSION_LIMIT:20}
            window: ${APP_AUTH_RATE_LIMIT_REFRESH_SESSION_WINDOW:PT10M}
        register:
          ip:
            limit: ${APP_AUTH_RATE_LIMIT_REGISTER_IP_LIMIT:10}
            window: ${APP_AUTH_RATE_LIMIT_REGISTER_IP_WINDOW:PT10M}
        register-context:
          ip:
            limit: ${APP_AUTH_RATE_LIMIT_REGISTER_CONTEXT_IP_LIMIT:30}
            window: ${APP_AUTH_RATE_LIMIT_REGISTER_CONTEXT_IP_WINDOW:PT1M}
    registration:
      context-token-ttl: ${APP_AUTH_REGISTRATION_CONTEXT_TOKEN_TTL:PT10M}
      context-lock-ttl: ${APP_AUTH_REGISTRATION_CONTEXT_LOCK_TTL:PT1M}
    lockout:
      enabled: ${APP_AUTH_LOCKOUT_ENABLED:true}
      threshold: ${APP_AUTH_LOCKOUT_THRESHOLD:5}
      duration: ${APP_AUTH_LOCKOUT_DURATION:PT15M}

platform:
  internal-api:
    enabled: ${PLATFORM_INTERNAL_API_ENABLED:true}
    token: ${PLATFORM_INTERNAL_API_TOKEN}

integration:
  ai:
    base-url: ${AI_GATEWAY_BASE_URL:http://localhost:8090}
    internal-token: ${PLATFORM_INTERNAL_API_TOKEN}
    connect-timeout: ${AI_GATEWAY_CONNECT_TIMEOUT:PT3S}
    read-timeout: ${AI_GATEWAY_READ_TIMEOUT:PT10M}
    max-attempts: ${AI_GATEWAY_MAX_ATTEMPTS:1}
    retry-backoff: ${AI_GATEWAY_RETRY_BACKOFF:PT0.2S}
    degrade-enabled: ${AI_GATEWAY_DEGRADE_ENABLED:true}

logging:
  level:
    root: INFO
    com.huashi.eftransfer: INFO
    org.springframework.security: INFO
  pattern:
    level: "%5p [traceId:%X{traceId:-}]"
    correlation: "[%X{traceId:-}]"

springdoc:
  swagger-ui:
    path: /swagger-ui.html
