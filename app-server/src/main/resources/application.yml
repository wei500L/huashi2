server:
  port: ${APP_SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: app-server
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: jdbc:mysql://${APP_DB_HOST:localhost}:${APP_DB_PORT:3306}/${APP_DB_NAME:ef_transfer_app}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
    username: ${APP_DB_USERNAME:ef_user}
    password: ${APP_DB_PASSWORD:ef_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      password: ${REDIS_PASSWORD:}
      timeout: 3s
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:ef_admin}
    password: ${RABBITMQ_PASSWORD:ef_password}
    virtual-host: ${RABBITMQ_VHOST:/}
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  info:
    env:
      enabled: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: true
      logic-not-delete-value: false

app:
  redis:
    redisson-enabled: ${APP_REDIS_REDISSON_ENABLED:true}
  events:
    rabbit-publish-enabled: ${APP_EVENTS_RABBIT_PUBLISH_ENABLED:true}
  analytics:
    compensation:
      enabled: ${APP_ANALYTICS_COMPENSATION_ENABLED:true}
  ops:
    config:
      encryption-secret: ${APP_OPS_CONFIG_ENCRYPTION_SECRET:}
  internal:
    knowledge:
      token: ${APP_INTERNAL_KNOWLEDGE_TOKEN:}
  security:
    jwt:
      secret: ${APP_JWT_SECRET:replace-me-with-a-32-byte-minimum-secret-key}
      issuer: ${APP_JWT_ISSUER:ef-transfer-platform}
      access-token-ttl: ${APP_JWT_ACCESS_TTL:PT6H}
      refresh-token-ttl: ${APP_JWT_REFRESH_TTL:PT168H}

integration:
  ai:
    base-url: ${AI_GATEWAY_BASE_URL:http://localhost:8090}
    connect-timeout: ${AI_GATEWAY_CONNECT_TIMEOUT:PT3S}
    read-timeout: ${AI_GATEWAY_READ_TIMEOUT:PT5S}
    max-attempts: ${AI_GATEWAY_MAX_ATTEMPTS:2}
    retry-backoff: ${AI_GATEWAY_RETRY_BACKOFF:PT0.2S}
    degrade-enabled: ${AI_GATEWAY_DEGRADE_ENABLED:true}

logging:
  level:
    root: INFO
    com.huashi.eftransfer: INFO
    org.springframework.security: INFO
  pattern:
    level: "%5p [traceId:%X{traceId:-}]"
