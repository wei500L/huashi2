spring:
  datasource:
    url: jdbc:h2:mem:authdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

app:
  redis:
    redisson-enabled: false
  events:
    rabbit-publish-enabled: false
  analytics:
    compensation:
      enabled: false
  ops:
    config:
      encryption-secret: 0123456789abcdef0123456789abcdef
  internal:
    knowledge:
      token: test-internal-knowledge-token
  security:
    jwt:
      secret: 0123456789abcdef0123456789abcdef
      issuer: ef-transfer-platform-test
      access-token-ttl: PT30M
      refresh-token-ttl: PT24H

management:
  health:
    redis:
      enabled: false
    rabbit:
      enabled: false

logging:
  level:
    root: WARN
    com.huashi.eftransfer: INFO
