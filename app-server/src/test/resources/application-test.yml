spring:
  main:
    allow-bean-definition-overriding: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  datasource:
    url: jdbc:h2:mem:${random.uuid};MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-h2.sql
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

app:
  redis:
    redisson-enabled: false
  demo-data:
    enabled: true
  events:
    rabbit-publish-enabled: false
  analytics:
    compensation:
      enabled: false
  ops:
    config:
      encryption-secret: x7Pq2Lk9Vd4Nc8Rs1Tf6Yh3Jm5Bw0QeZ
  security:
    jwt:
      secret: x7Pq2Lk9Vd4Nc8Rs1Tf6Yh3Jm5Bw0QeZ
      issuer: ef-transfer-platform-test
      access-token-ttl: PT30M
      refresh-token-ttl: PT24H

platform:
  internal-api:
    enabled: true
    token: test-internal-knowledge-token

integration:
  ai:
    base-url: http://localhost:8090
    internal-token: test-internal-knowledge-token

management:
  health:
    redis:
      enabled: false
    rabbit:
      enabled: false

logging:
  level:
    root: WARN
    com.huashi.eftransfer: INFO
