services:
  mysql:
    image: mysql:8.4.8
    container_name: ef-transfer-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${APP_DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${APP_DB_NAME}
      MYSQL_USER: ${APP_DB_USERNAME}
      MYSQL_PASSWORD: ${APP_DB_PASSWORD}
      TZ: UTC
    ports:
      - "${APP_DB_PORT}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --max_allowed_packet=134217728
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p${APP_DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-bookworm
    container_name: ef-transfer-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:${REDIS_PORT}:6379"
    volumes:
      - redis-data:/data
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$REDIS_PASSWORD"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4.2.5-management
    container_name: ef-transfer-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST}
    ports:
      - "${RABBITMQ_PORT}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres:
    build:
      context: ./postgres-vector
    container_name: ef-transfer-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${AI_DB_NAME}
      POSTGRES_USER: ${AI_DB_USERNAME}
      POSTGRES_PASSWORD: ${AI_DB_PASSWORD}
      TZ: UTC
    ports:
      - "${AI_DB_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AI_DB_USERNAME} -d ${AI_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10

  ai-gateway:
    build:
      context: ..
      dockerfile: deploy/ai-gateway/Dockerfile
    container_name: ef-transfer-ai-gateway
    user: "0:0"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      AI_GATEWAY_PORT: 8090
      AI_GATEWAY_MANAGEMENT_PORT: ${AI_GATEWAY_MANAGEMENT_PORT:-18090}
      AI_DB_HOST: postgres
      AI_DB_PORT: 5432
      AI_DB_NAME: ${AI_DB_NAME}
      AI_DB_USERNAME: ${AI_DB_USERNAME}
      AI_DB_PASSWORD: ${AI_DB_PASSWORD}
      AI_PROVIDER: ${AI_PROVIDER}
      AI_FALLBACK_PROVIDER: ${AI_FALLBACK_PROVIDER}
      AI_OPENAI_BASE_URL: ${AI_OPENAI_BASE_URL}
      AI_OPENAI_API_KEY: ${AI_OPENAI_API_KEY}
      SPRING_AI_OPENAI_BASE_URL: ${AI_OPENAI_BASE_URL}
      SPRING_AI_OPENAI_API_KEY: ${AI_OPENAI_API_KEY}
      AI_CHAT_MODEL: ${AI_CHAT_MODEL}
      AI_CHAT_CONNECT_TIMEOUT: ${AI_CHAT_CONNECT_TIMEOUT}
      AI_CHAT_READ_TIMEOUT: ${AI_CHAT_READ_TIMEOUT}
      AI_CHAT_TEMPERATURE: ${AI_CHAT_TEMPERATURE}
      AI_CHAT_MAX_TOKENS: ${AI_CHAT_MAX_TOKENS}
      AI_EMBEDDING_BASE_URL: ${AI_EMBEDDING_BASE_URL}
      AI_EMBEDDING_API_KEY: ${AI_EMBEDDING_API_KEY}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL}
      AI_MULTIMODAL_EMBEDDING_MODEL: ${AI_MULTIMODAL_EMBEDDING_MODEL}
      AI_EMBEDDING_CONNECT_TIMEOUT: ${AI_EMBEDDING_CONNECT_TIMEOUT}
      AI_EMBEDDING_READ_TIMEOUT: ${AI_EMBEDDING_READ_TIMEOUT}
      AI_EMBEDDING_DIMENSION: ${AI_EMBEDDING_DIMENSION}
      AI_RERANK_PROTOCOL: ${AI_RERANK_PROTOCOL}
      AI_RERANK_MODEL: ${AI_RERANK_MODEL}
      AI_MULTIMODAL_RERANK_MODEL: ${AI_MULTIMODAL_RERANK_MODEL}
      AI_RERANK_BASE_URL: ${AI_RERANK_BASE_URL}
      AI_RERANK_API_KEY: ${AI_RERANK_API_KEY}
      AI_RERANK_CONNECT_TIMEOUT: ${AI_RERANK_CONNECT_TIMEOUT}
      AI_RERANK_READ_TIMEOUT: ${AI_RERANK_READ_TIMEOUT}
      AI_FALLBACK_CHAT_BASE_URL: ${AI_FALLBACK_CHAT_BASE_URL}
      AI_FALLBACK_CHAT_API_KEY: ${AI_FALLBACK_CHAT_API_KEY}
      AI_FALLBACK_CHAT_MODEL: ${AI_FALLBACK_CHAT_MODEL}
      AI_FALLBACK_CHAT_CONNECT_TIMEOUT: ${AI_FALLBACK_CHAT_CONNECT_TIMEOUT}
      AI_FALLBACK_CHAT_READ_TIMEOUT: ${AI_FALLBACK_CHAT_READ_TIMEOUT}
      AI_FALLBACK_CHAT_TEMPERATURE: ${AI_FALLBACK_CHAT_TEMPERATURE}
      AI_FALLBACK_CHAT_MAX_TOKENS: ${AI_FALLBACK_CHAT_MAX_TOKENS}
      AI_FALLBACK_EMBEDDING_BASE_URL: ${AI_FALLBACK_EMBEDDING_BASE_URL}
      AI_FALLBACK_EMBEDDING_API_KEY: ${AI_FALLBACK_EMBEDDING_API_KEY}
      AI_FALLBACK_EMBEDDING_MODEL: ${AI_FALLBACK_EMBEDDING_MODEL}
      AI_FALLBACK_MULTIMODAL_EMBEDDING_MODEL: ${AI_FALLBACK_MULTIMODAL_EMBEDDING_MODEL}
      AI_FALLBACK_EMBEDDING_CONNECT_TIMEOUT: ${AI_FALLBACK_EMBEDDING_CONNECT_TIMEOUT}
      AI_FALLBACK_EMBEDDING_READ_TIMEOUT: ${AI_FALLBACK_EMBEDDING_READ_TIMEOUT}
      AI_FALLBACK_EMBEDDING_DIMENSION: ${AI_FALLBACK_EMBEDDING_DIMENSION}
      AI_FALLBACK_RERANK_PROTOCOL: ${AI_FALLBACK_RERANK_PROTOCOL}
      AI_FALLBACK_RERANK_BASE_URL: ${AI_FALLBACK_RERANK_BASE_URL}
      AI_FALLBACK_RERANK_API_KEY: ${AI_FALLBACK_RERANK_API_KEY}
      AI_FALLBACK_RERANK_MODEL: ${AI_FALLBACK_RERANK_MODEL}
      AI_FALLBACK_MULTIMODAL_RERANK_MODEL: ${AI_FALLBACK_MULTIMODAL_RERANK_MODEL}
      AI_FALLBACK_RERANK_CONNECT_TIMEOUT: ${AI_FALLBACK_RERANK_CONNECT_TIMEOUT}
      AI_FALLBACK_RERANK_READ_TIMEOUT: ${AI_FALLBACK_RERANK_READ_TIMEOUT}
      AI_RETRY_MAX_ATTEMPTS: ${AI_RETRY_MAX_ATTEMPTS}
      AI_RETRY_WAIT_DURATION: ${AI_RETRY_WAIT_DURATION}
      AI_CIRCUIT_BREAKER_FAILURE_RATE_THRESHOLD: ${AI_CIRCUIT_BREAKER_FAILURE_RATE_THRESHOLD}
      AI_CIRCUIT_BREAKER_SLIDING_WINDOW_SIZE: ${AI_CIRCUIT_BREAKER_SLIDING_WINDOW_SIZE}
      AI_CIRCUIT_BREAKER_OPEN_STATE_DURATION: ${AI_CIRCUIT_BREAKER_OPEN_STATE_DURATION}
      APP_SERVER_BASE_URL: ${APP_SERVER_BASE_URL:-http://app-server:8080}
      APP_SERVER_CONNECT_TIMEOUT: ${APP_SERVER_CONNECT_TIMEOUT:-PT3S}
      APP_SERVER_READ_TIMEOUT: ${APP_SERVER_READ_TIMEOUT:-PT5S}
      RAG_EXPORT_PAGE_SIZE: ${RAG_EXPORT_PAGE_SIZE:-100}
      RAG_EMBEDDING_BATCH_SIZE: ${RAG_EMBEDDING_BATCH_SIZE:-32}
      RAG_RECALL_TOP_K: ${RAG_RECALL_TOP_K:-20}
      RAG_RECALL_THRESHOLD: ${RAG_RECALL_THRESHOLD:-0.55}
      RAG_RERANK_TOP_N: ${RAG_RERANK_TOP_N:-8}
      RAG_RERANK_THRESHOLD: ${RAG_RERANK_THRESHOLD:-0.2}
      RAG_FINAL_TOP_K: ${RAG_FINAL_TOP_K:-6}
      AI_HNSW_EF_SEARCH: ${AI_HNSW_EF_SEARCH:-64}
      AI_HNSW_M: ${AI_HNSW_M:-16}
      AI_HNSW_EF_CONSTRUCTION: ${AI_HNSW_EF_CONSTRUCTION:-128}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST}
      PLATFORM_INTERNAL_API_ENABLED: true
      PLATFORM_INTERNAL_API_TOKEN: ${PLATFORM_INTERNAL_API_TOKEN}
      TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-0.1}
      OTEL_EXPORTER_ENABLED: ${OTEL_EXPORTER_ENABLED:-false}
      LOG_DIR: ${LOG_DIR:-/app/logs}
      LOG_MAX_FILE_SIZE: ${LOG_MAX_FILE_SIZE:-100MB}
      LOG_MAX_HISTORY: ${LOG_MAX_HISTORY:-7}
      LOG_TOTAL_SIZE_CAP: ${LOG_TOTAL_SIZE_CAP:-1GB}
    ports:
      - "${AI_GATEWAY_PORT}:8090"
    volumes:
      - ai-gateway-logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "bash -lc 'exec 3<>/dev/tcp/127.0.0.1/${AI_GATEWAY_MANAGEMENT_PORT:-18090} && printf \"GET /actuator/health HTTP/1.1\\r\\nHost: 127.0.0.1\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && response=\"\" && while IFS= read -r line <&3 || [ -n \"$$line\" ]; do response=\"$$response$$line\"; done && [[ \"$$response\" == *\"\\\"status\\\":\\\"UP\\\"\"* ]]'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  app-server:
    build:
      context: ..
      dockerfile: deploy/app-server/Dockerfile
    container_name: ef-transfer-app-server
    user: "0:0"
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      ai-gateway:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      APP_SERVER_PORT: 8080
      APP_DB_HOST: mysql
      APP_DB_PORT: 3306
      APP_DB_NAME: ${APP_DB_NAME}
      APP_DB_USERNAME: ${APP_DB_USERNAME}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DATABASE: ${REDIS_DATABASE}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST}
      APP_OPS_CONFIG_ENCRYPTION_SECRET: ${APP_OPS_CONFIG_ENCRYPTION_SECRET}
      APP_JWT_ACTIVE_KID: ${APP_JWT_ACTIVE_KID}
      APP_JWT_KEYS_0_KID: ${APP_JWT_KEYS_0_KID}
      APP_JWT_KEYS_0_SECRET: ${APP_JWT_KEYS_0_SECRET}
      APP_JWT_KEYS_1_KID: ${APP_JWT_KEYS_1_KID}
      APP_JWT_KEYS_1_SECRET: ${APP_JWT_KEYS_1_SECRET}
      APP_JWT_LEGACY_SECRET: ${APP_JWT_LEGACY_SECRET}
      APP_JWT_ISSUER: ${APP_JWT_ISSUER}
      APP_JWT_ACCESS_TTL: ${APP_JWT_ACCESS_TTL}
      APP_JWT_REFRESH_TTL: ${APP_JWT_REFRESH_TTL}
      APP_DB_POOL_MAX_SIZE: ${APP_DB_POOL_MAX_SIZE}
      APP_DB_POOL_MIN_IDLE: ${APP_DB_POOL_MIN_IDLE}
      APP_DB_POOL_CONNECTION_TIMEOUT: ${APP_DB_POOL_CONNECTION_TIMEOUT}
      APP_DB_POOL_IDLE_TIMEOUT: ${APP_DB_POOL_IDLE_TIMEOUT}
      APP_DB_POOL_MAX_LIFETIME: ${APP_DB_POOL_MAX_LIFETIME}
      APP_DEMO_DATA_ENABLED: ${APP_DEMO_DATA_ENABLED:-false}
      PLATFORM_INTERNAL_API_ENABLED: true
      PLATFORM_INTERNAL_API_TOKEN: ${PLATFORM_INTERNAL_API_TOKEN}
      AI_GATEWAY_BASE_URL: http://ai-gateway:8090
      AI_GATEWAY_CONNECT_TIMEOUT: ${AI_GATEWAY_CONNECT_TIMEOUT}
      AI_GATEWAY_READ_TIMEOUT: ${AI_GATEWAY_READ_TIMEOUT}
      TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-0.1}
      OTEL_EXPORTER_ENABLED: ${OTEL_EXPORTER_ENABLED:-false}
      LOG_DIR: ${LOG_DIR:-/app/logs}
      LOG_MAX_FILE_SIZE: ${LOG_MAX_FILE_SIZE:-100MB}
      LOG_MAX_HISTORY: ${LOG_MAX_HISTORY:-7}
      LOG_TOTAL_SIZE_CAP: ${LOG_TOTAL_SIZE_CAP:-1GB}
    ports:
      - "${APP_SERVER_PORT}:8080"
    volumes:
      - app-server-logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "bash -lc 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf \"GET /actuator/health HTTP/1.1\\r\\nHost: 127.0.0.1\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && response=\"\" && while IFS= read -r line <&3 || [ -n \"$$line\" ]; do response=\"$$response$$line\"; done && [[ \"$$response\" == *\"\\\"status\\\":\\\"UP\\\"\"* ]]'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    build:
      context: ..
      dockerfile: deploy/frontend/Dockerfile
    container_name: ef-transfer-frontend
    restart: unless-stopped
    depends_on:
      app-server:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  app-server-logs:
  ai-gateway-logs:
  mysql-data:
  redis-data:
  rabbitmq-data:
  postgres-data:
