services:
  mysql:
    ports: !override
      - "127.0.0.1:13306:3306"

  redis:
    ports: !override
      - "127.0.0.1:16379:6379"

  rabbitmq:
    ports: !override
      - "127.0.0.1:15673:5672"
      - "127.0.0.1:25673:15672"

  postgres:
    ports: !override
      - "127.0.0.1:15432:5432"

  ai-gateway:
    ports: !override
      - "127.0.0.1:18090:8090"

  app-server:
    environment:
      APP_DB_SSL_MODE: ${APP_DB_SSL_MODE:-REQUIRED}
      APP_CORS_ALLOWED_ORIGIN_LOCALHOST: https://${PUBLIC_DOMAIN}
      APP_CORS_ALLOWED_ORIGIN_LOOPBACK: https://${PUBLIC_DOMAIN}
      APP_CORS_ALLOW_CREDENTIALS: "true"
      APP_ASSESSMENT_CODE_HMAC_SECRET: ${APP_ASSESSMENT_CODE_HMAC_SECRET}
      APP_ASSESSMENT_SENSITIVE_PROFILE_KEY: ${APP_ASSESSMENT_SENSITIVE_PROFILE_KEY}
      APP_ASSESSMENT_SENSITIVE_PROFILE_KEY_VERSION: ${APP_ASSESSMENT_SENSITIVE_PROFILE_KEY_VERSION:-v1}
      APP_ASSESSMENT_PUBLIC_SESSION_TTL: ${APP_ASSESSMENT_PUBLIC_SESSION_TTL:-PT12H}
      APP_ASSESSMENT_LEXIBRIDGE_SEED_ENABLED: ${APP_ASSESSMENT_LEXIBRIDGE_SEED_ENABLED:-true}
    ports: !override
      - "127.0.0.1:18081:8080"

  frontend:
    ports: !override
      - "127.0.0.1:13000:3000"
