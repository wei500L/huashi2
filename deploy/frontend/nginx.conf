map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

# The host reverse proxy overwrites X-Forwarded-For with the trusted client IP.
# Preserve only that first address instead of appending the Docker gateway hop.
map $http_x_forwarded_for $trusted_client_ip {
  "~^\s*(?<client_ip>[^,\s]+)" $client_ip;
  default $remote_addr;
}

# Keep the original browser scheme supplied by the trusted host proxy so
# Spring marks participant session cookies as Secure on HTTPS requests.
map $http_x_forwarded_proto $trusted_forwarded_proto {
  "~*^https$" https;
  "~*^http$" http;
  default $scheme;
}

server {
  listen 3000;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 64m;

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 'ok';
  }

  # AI endpoints can take longer than generic CRUD (structured chat + RAG + grounding).
  location /api/ai/ {
    proxy_pass http://app-server:8080/api/ai/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $trusted_client_ip;
    proxy_set_header X-Forwarded-For $trusted_client_ip;
    proxy_set_header X-Forwarded-Proto $trusted_forwarded_proto;
    proxy_connect_timeout 5s;
    proxy_read_timeout 180s;
  }

  location /api/teacher/research/ {
    proxy_pass http://app-server:8080/api/teacher/research/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $trusted_client_ip;
    proxy_set_header X-Forwarded-For $trusted_client_ip;
    proxy_set_header X-Forwarded-Proto $trusted_forwarded_proto;
    proxy_connect_timeout 5s;
    proxy_read_timeout 360s;
    proxy_send_timeout 360s;
  }

  location /api/ {
    proxy_pass http://app-server:8080/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $trusted_client_ip;
    proxy_set_header X-Forwarded-For $trusted_client_ip;
    proxy_set_header X-Forwarded-Proto $trusted_forwarded_proto;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
  }

  location /ws/ {
    proxy_pass http://app-server:8080/ws/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $trusted_client_ip;
    proxy_set_header X-Forwarded-For $trusted_client_ip;
    proxy_set_header X-Forwarded-Proto $trusted_forwarded_proto;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_connect_timeout 5s;
    proxy_read_timeout 3600s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
