map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

# Keep the original browser scheme supplied by the trusted host proxy so
# Spring marks participant session cookies as Secure on HTTPS requests.
map $http_x_forwarded_proto $trusted_forwarded_proto {
  "~*^https$" https;
  "~*^http$" http;
  default $scheme;
}

server {
  listen 3000;
  server_name _;

  # Only rewrite $remote_addr from X-Forwarded-For when the connecting hop is
  # a private/Docker/loopback proxy. Direct clients cannot spoof the header.
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  set_real_ip_from 127.0.0.1;
  set_real_ip_from ::1;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 64m;

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 'ok';
  }

  # AI endpoints can take longer than generic CRUD (structured chat + RAG + grounding).
  location /api/ai/ {
    proxy_pass http://app-server:8080/api/ai/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $trusted_forwarded_proto;
    proxy_connect_timeout 5s;
    proxy_read_timeout 180s;
  }

  location /api/teacher/research/ {
    proxy_pass http://app-server:8080/api/teacher/research/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $trusted_forwarded_proto;
    proxy_connect_timeout 5s;
    proxy_read_timeout 360s;
    proxy_send_timeout 360s;
  }

  location = /api/teacher/intervention-suggest {
    proxy_pass http://app-server:8080/api/teacher/intervention-suggest;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $trusted_forwarded_proto;
    proxy_connect_timeout 5s;
    proxy_read_timeout 180s;
  }

  location /api/ {
    proxy_pass http://app-server:8080/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $trusted_forwarded_proto;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
  }

  location /ws/ {
    proxy_pass http://app-server:8080/ws/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $trusted_forwarded_proto;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_connect_timeout 5s;
    proxy_read_timeout 3600s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
