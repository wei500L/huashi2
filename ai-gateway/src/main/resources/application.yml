server:
  port: ${AI_GATEWAY_PORT:8090}
  shutdown: graceful

spring:
  application:
    name: ai-gateway
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:ef_admin}
    password: ${RABBITMQ_PASSWORD:ef_password}
    virtual-host: ${RABBITMQ_VHOST:/}
    listener:
      simple:
        default-requeue-rejected: false
        prefetch: ${AI_RABBITMQ_LISTENER_PREFETCH:1}
        concurrency: ${AI_RABBITMQ_LISTENER_CONCURRENCY:1}
        max-concurrency: ${AI_RABBITMQ_LISTENER_CONCURRENCY:1}
  datasource:
    url: jdbc:postgresql://${AI_DB_HOST:localhost}:${AI_DB_PORT:5432}/${AI_DB_NAME:ef_transfer_ai}
    username: ${AI_DB_USERNAME:ef_ai}
    password: ${AI_DB_PASSWORD:ef_ai_password}
    driver-class-name: org.postgresql.Driver
  ai:
    vectorstore:
      pgvector:
        initialize-schema: false
        dimensions: ${AI_EMBEDDING_DIMENSION:1024}

management:
  server:
    port: ${AI_GATEWAY_MANAGEMENT_PORT:18090}
    address: ${MANAGEMENT_SERVER_ADDRESS:127.0.0.1}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
    export:
      otlp:
        enabled: ${OTEL_EXPORTER_ENABLED:false}
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

# Bootstrap defaults for ai-gateway startup only. Once app-server has a stored
# admin snapshot, DATABASE / APP_SERVER_SYNC runtime config should override these
# example URLs and model ids.
ai:
  runtime:
    sync-retry-initial-delay: ${AI_RUNTIME_SYNC_RETRY_INITIAL_DELAY:PT10S}
    sync-retry-interval: ${AI_RUNTIME_SYNC_RETRY_INTERVAL:PT10S}
  provider:
    active-provider: ${AI_PROVIDER:qwen}
    fallback-provider: ${AI_FALLBACK_PROVIDER:deepseek}
    providers:
      qwen:
        chat:
          base-url: ${AI_OPENAI_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
          api-key: ${AI_OPENAI_API_KEY:}
          model: ${AI_CHAT_MODEL:qwen-max}
          connect-timeout: ${AI_CHAT_CONNECT_TIMEOUT:PT3S}
          read-timeout: ${AI_CHAT_READ_TIMEOUT:PT30S}
          temperature: ${AI_CHAT_TEMPERATURE:0.2}
          max-tokens: ${AI_CHAT_MAX_TOKENS:2048}
        embedding:
          base-url: ${AI_EMBEDDING_BASE_URL:${AI_OPENAI_BASE_URL:https://api.siliconflow.cn/v1}}
          api-key: ${AI_EMBEDDING_API_KEY:${AI_OPENAI_API_KEY:}}
          model: ${AI_EMBEDDING_MODEL:Qwen/Qwen3-Embedding-8B}
          multimodal-model: ${AI_MULTIMODAL_EMBEDDING_MODEL:Qwen/Qwen3-VL-Embedding-8B}
          connect-timeout: ${AI_EMBEDDING_CONNECT_TIMEOUT:PT3S}
          read-timeout: ${AI_EMBEDDING_READ_TIMEOUT:PT30S}
          dimension: ${AI_EMBEDDING_DIMENSION:1024}
        rerank:
          protocol: ${AI_RERANK_PROTOCOL:openai-rerank}
          base-url: ${AI_RERANK_BASE_URL:${AI_OPENAI_BASE_URL:https://api.siliconflow.cn/v1}}
          api-key: ${AI_RERANK_API_KEY:${AI_OPENAI_API_KEY:}}
          model: ${AI_RERANK_MODEL:Qwen/Qwen3-Reranker-8B}
          multimodal-model: ${AI_MULTIMODAL_RERANK_MODEL:Qwen/Qwen3-VL-Reranker-8B}
          connect-timeout: ${AI_RERANK_CONNECT_TIMEOUT:PT3S}
          read-timeout: ${AI_RERANK_READ_TIMEOUT:PT30S}
      deepseek:
        chat:
          base-url: ${AI_FALLBACK_CHAT_BASE_URL:${AI_OPENAI_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}}
          api-key: ${AI_FALLBACK_CHAT_API_KEY:${AI_OPENAI_API_KEY:}}
          model: ${AI_FALLBACK_CHAT_MODEL:${AI_CHAT_MODEL:qwen-max}}
          connect-timeout: ${AI_FALLBACK_CHAT_CONNECT_TIMEOUT:${AI_CHAT_CONNECT_TIMEOUT:PT3S}}
          read-timeout: ${AI_FALLBACK_CHAT_READ_TIMEOUT:${AI_CHAT_READ_TIMEOUT:PT30S}}
          temperature: ${AI_FALLBACK_CHAT_TEMPERATURE:${AI_CHAT_TEMPERATURE:0.2}}
          max-tokens: ${AI_FALLBACK_CHAT_MAX_TOKENS:${AI_CHAT_MAX_TOKENS:2048}}
        embedding:
          base-url: ${AI_FALLBACK_EMBEDDING_BASE_URL:${AI_EMBEDDING_BASE_URL:${AI_OPENAI_BASE_URL:https://api.siliconflow.cn/v1}}}
          api-key: ${AI_FALLBACK_EMBEDDING_API_KEY:${AI_OPENAI_API_KEY:}}
          model: ${AI_FALLBACK_EMBEDDING_MODEL:${AI_EMBEDDING_MODEL:Qwen/Qwen3-Embedding-8B}}
          multimodal-model: ${AI_FALLBACK_MULTIMODAL_EMBEDDING_MODEL:${AI_MULTIMODAL_EMBEDDING_MODEL:Qwen/Qwen3-VL-Embedding-8B}}
          connect-timeout: ${AI_FALLBACK_EMBEDDING_CONNECT_TIMEOUT:${AI_EMBEDDING_CONNECT_TIMEOUT:PT3S}}
          read-timeout: ${AI_FALLBACK_EMBEDDING_READ_TIMEOUT:${AI_EMBEDDING_READ_TIMEOUT:PT30S}}
          dimension: ${AI_FALLBACK_EMBEDDING_DIMENSION:${AI_EMBEDDING_DIMENSION:1024}}
        rerank:
          protocol: ${AI_FALLBACK_RERANK_PROTOCOL:${AI_RERANK_PROTOCOL:openai-rerank}}
          base-url: ${AI_FALLBACK_RERANK_BASE_URL:${AI_RERANK_BASE_URL:${AI_OPENAI_BASE_URL:https://api.siliconflow.cn/v1}}}
          api-key: ${AI_FALLBACK_RERANK_API_KEY:${AI_OPENAI_API_KEY:}}
          model: ${AI_FALLBACK_RERANK_MODEL:${AI_RERANK_MODEL:Qwen/Qwen3-Reranker-8B}}
          multimodal-model: ${AI_FALLBACK_MULTIMODAL_RERANK_MODEL:${AI_MULTIMODAL_RERANK_MODEL:Qwen/Qwen3-VL-Reranker-8B}}
          connect-timeout: ${AI_FALLBACK_RERANK_CONNECT_TIMEOUT:${AI_RERANK_CONNECT_TIMEOUT:PT3S}}
          read-timeout: ${AI_FALLBACK_RERANK_READ_TIMEOUT:${AI_RERANK_READ_TIMEOUT:PT30S}}
  resilience:
    max-attempts: ${AI_RETRY_MAX_ATTEMPTS:3}
    wait-duration: ${AI_RETRY_WAIT_DURATION:PT0.5S}
    failure-rate-threshold: ${AI_CIRCUIT_BREAKER_FAILURE_RATE_THRESHOLD:50}
    sliding-window-size: ${AI_CIRCUIT_BREAKER_SLIDING_WINDOW_SIZE:20}
    open-state-duration: ${AI_CIRCUIT_BREAKER_OPEN_STATE_DURATION:PT30S}

logging:
  level:
    root: INFO
    com.huashi.eftransfer: INFO
  pattern:
    level: "%5p [traceId:%X{traceId:-}]"
    correlation: "[%X{traceId:-}]"

rag:
  app-server:
    base-url: ${APP_SERVER_BASE_URL:http://localhost:8080}
    internal-token: ${PLATFORM_INTERNAL_API_TOKEN}
    connect-timeout: ${APP_SERVER_CONNECT_TIMEOUT:PT3S}
    read-timeout: ${APP_SERVER_READ_TIMEOUT:PT5S}
  ingestion:
    export-page-size: ${RAG_EXPORT_PAGE_SIZE:100}
    embedding-batch-size: ${RAG_EMBEDDING_BATCH_SIZE:32}
    failed-retry-enabled: ${RAG_FAILED_RETRY_ENABLED:true}
    failed-retry-limit: ${RAG_FAILED_RETRY_LIMIT:64}
    failed-retry-interval: ${RAG_FAILED_RETRY_INTERVAL:PT1M}
  retrieval:
    recall-top-k: ${RAG_RECALL_TOP_K:20}
    recall-threshold: ${RAG_RECALL_THRESHOLD:0.55}
    rerank-top-n: ${RAG_RERANK_TOP_N:8}
    rerank-threshold: ${RAG_RERANK_THRESHOLD:0.2}
    final-top-k: ${RAG_FINAL_TOP_K:6}
    hnsw-ef-search: ${AI_HNSW_EF_SEARCH:64}

platform:
  internal-api:
    enabled: ${PLATFORM_INTERNAL_API_ENABLED:true}
    token: ${PLATFORM_INTERNAL_API_TOKEN}
