spring:
  config:
    activate:
      on-profile: prod
  sql:
    init:
      mode: never

server:
  forward-headers-strategy: framework

management:
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: WARN
    com.huashi.eftransfer: INFO

ai:
  provider-endpoint-policy:
    allow-private-networks: ${AI_PROVIDER_ALLOW_PRIVATE_NETWORKS:false}
    require-https: ${AI_PROVIDER_REQUIRE_HTTPS:true}
