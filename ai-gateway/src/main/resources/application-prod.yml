spring:
  config:
    activate:
      on-profile: prod
  sql:
    init:
      mode: never

server:
  forward-headers-strategy: framework

management:
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: WARN
    com.huashi.eftransfer: INFO

ai:
  embedding-space-policy:
    enabled: true
    model: Qwen/Qwen3-Embedding-8B
    dimension: 1024
